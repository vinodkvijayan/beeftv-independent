name: Independent Windows build

# Unofficial build for this independent repository only.
# It does not publish to BeefTV update feeds, R2, or COS.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: independent-windows-build
  cancel-in-progress: false

jobs:
  windows:
    name: Build windows-amd64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select bundled Node runtime
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p=require("path"); const bin=p.dirname(process.execPath); fs.appendFileSync(process.env.GITHUB_ENV, `BEEFTV_NODE_RUNTIME=${process.platform==="win32"?bin:p.dirname(bin)}\n`);'

      - name: Windows compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Select Windows compiler and NSIS
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Windows desktop
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-beeftv-windows-release.ps1

      - name: Package NSIS installer
        shell: bash
        run: python scripts/package-desktop-installer.py --platform windows-amd64

      - name: Zip portable build
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Join-Path (Resolve-Path dist) "BeefTV-$version-windows-amd64-portable.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          tar -a -c -f $zip -C "backend\cmd\desktop\build\bin" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="windows-${version}"
          export RELEASE_NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          python scripts/independent-release-notes.py
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              "dist/BeefTV-${version}-windows-amd64-setup.exe" \
              "dist/BeefTV-${version}-windows-amd64-portable.zip"
          else
            gh release create "$tag" \
              --title "Independent Windows build ${version}" \
              --notes-file "$RELEASE_NOTES_PATH" \
              "dist/BeefTV-${version}-windows-amd64-setup.exe" \
              "dist/BeefTV-${version}-windows-amd64-portable.zip"
          fi
